name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Run tests
        run: python -m pytest -q

      - name: Dependency audit (pip-audit)
        run: python -m pip_audit

      - name: Verify no ignored artifacts are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '\.venv/|__pycache__/|\.pytest_cache/|\.mypy_cache/|\.ruff_cache/|\.pyc$|\.egg-info/'; then
            echo "Found tracked files that should be gitignored" >&2
            exit 1
          fi